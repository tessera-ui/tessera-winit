[package]
name = "tessera-apple-ime-test"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
winit = { package = "tessera-winit", version = "0.30.13", path = "../..", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6.2"
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSString", "NSRange"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.2.2", features = ["UIView", "UIResponder"] }
